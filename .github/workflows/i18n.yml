name: UI languages
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-production.mjs
      - run: npm run typecheck && npm run typecheck:client && npm run test:i18n
      - run: npm run build
      - run: I18N_CHECK_BUILD=1 npm run test:i18n
